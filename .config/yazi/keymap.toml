[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "cd ~/documents/Uni/Infomatik/Semester-2"
desc = "Cd to current semester"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "cd ~/documents/Vault/"
desc = "Cd to obsidian vault"

[[mgr.prepend_keymap]]
on  = "<C-n>"
run = "shell -- ripdrag %s -x 2>/dev/null &"

[[mgr.prepend_keymap]]
 on = "u"
 run = "plugin restore" 
 desc = "Restore last deleted files/folders"
