for_window [app_id="floatcenter"] {
    floating enable
    resize set width 1400 px height 900 px
    move position center
}

for_window [app_id="xdg-desktop-portal-gtk"] floating enable, resize set 900 600, move position center
for_window [app_id="io.github.bugaevc.wl-clipboard"] floating enable, opacity 0, border none
